services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyayavault
      POSTGRES_PASSWORD: nyayavault
      POSTGRES_DB: nyayavault
    ports:
      - "5432:5432"
    volumes:
      - nyayavault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayavault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://nyayavault:nyayavault@postgres:5432/nyayavault
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-in-production}
      JWT_ALGORITHM: HS256
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: "26214400"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
    volumes:
      - nyayavault_uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  nyayavault_pgdata:
  nyayavault_uploads:
